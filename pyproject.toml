[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-launcher"
version = "1.0.4"
description = "Two claps → JARVIS speaks → launches your workspace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "miniaudio>=1.59",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "edge-tts>=6.1.0",
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
windows = ["pyttsx3>=2.90"]
dev = ["pytest>=7.0.0"]

[project.scripts]
jarvis-launcher = "jarvis_launcher.main:main"
jarvis = "jarvis_launcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_launcher"]
